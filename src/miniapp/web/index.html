<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0d14">
  <title>Palic</title>
  <link rel="stylesheet" href="./css/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="rail">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 3h12l6 6v12H3z" fill="#f5b83d"/><path d="M8.5 18V7.5h5a3.25 3.25 0 0 1 0 6.5h-5" fill="none" stroke="#1a1204" stroke-width="2.4" stroke-linejoin="miter"/></svg>
    </div>
    <div class="brand">Palic<small>Trench desk · Solana</small></div>
    <div id="mode-pill" class="pill" hidden></div>
    <button type="button" id="sync" class="sync" aria-label="Umur data. Ketuk untuk memuat ulang"><i></i><span id="sync-age">live</span></button>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true"><span></span></div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs dock" aria-label="Menu">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h4l3-7 4 12 3-7h6"/></svg><span>Status</span>
    </button>
    <button type="button" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h7"/><circle cx="18" cy="16" r="3"/><path d="M20.2 18.2 22 20"/></svg><span>Screening</span>
    </button>
    <button type="button" data-tab="wallet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h15v12H3z"/><path d="M3 7l12-3v3"/><path d="M14 12h4v3h-4z"/></svg><span>Wallet</span>
    </button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18M12 3v18M19 3v18"/><path d="M3 8h4M10 15h4M17 10h4"/></svg><span>Setelan</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Aktifkan JavaScript untuk memakai Palic.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
